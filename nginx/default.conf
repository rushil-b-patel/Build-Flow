server {
    listen 80;
    server_name buildflow.rushilpatel.dev api.buildflow.rushilpatel.dev *.buildflow.rushilpatel.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name buildflow.rushilpatel.dev;

    ssl_certificate     /etc/letsencrypt/live/buildflow.rushilpatel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildflow.rushilpatel.dev/privkey.pem;

    root /srv/frontend;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.buildflow.rushilpatel.dev;

    ssl_certificate     /etc/letsencrypt/live/buildflow.rushilpatel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildflow.rushilpatel.dev/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://upload:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name *.buildflow.rushilpatel.dev;

    ssl_certificate     /etc/letsencrypt/live/buildflow.rushilpatel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildflow.rushilpatel.dev/privkey.pem;

    location / {
        proxy_pass http://request:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
