version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow
      POSTGRES_DB: buildflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  upload:
    build: ./upload
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      - redis
      - postgres
    env_file:
      - ./upload/.env

  deploy:
    build: ./deploy
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      - redis
      - postgres
    env_file:
      - ./deploy/.env

  request:
    build: ./request
    ports:
      - "3001:3001"
    env_file:
      - ./request/.env

volumes:
  pgdata:
