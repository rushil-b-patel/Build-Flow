services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow
      POSTGRES_DB: buildflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildflow -d buildflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  upload:
    build:
      context: .
      dockerfile: upload/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  deploy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  request:
    build:
      context: .
      dockerfile: request/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/usr/src/app/frontend
      - ./packages:/usr/src/app/packages
      - /usr/src/app/frontend/node_modules
    depends_on:
      - upload

volumes:
  pgdata:
