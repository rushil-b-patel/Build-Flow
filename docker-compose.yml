services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow
      POSTGRES_DB: buildflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  upload:
    build:
      context: .
      dockerfile: upload/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      - redis
      - postgres
    env_file:
      - ./.env.shared
      - ./upload/.env

  deploy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://buildflow:buildflow@postgres:5432/buildflow
    depends_on:
      - redis
      - postgres

  request:
    build:
      context: .
      dockerfile: request/Dockerfile
    ports:
      - "3001:3001"

volumes:
  pgdata:
